name: Prepare private production images

# To expose Run workflow, this file must also exist on the default branch.
# Select main or release/3.5.4-beta manually. This workflow never deploys to the VPS.
on:
  workflow_dispatch:
  workflow_run:
    workflows: [tests, linter]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# Serialize all publications, including reruns, to protect existing SHA tags.
# GHCR administrators can still retag images; immutable references use the
# verified digests reported in the summary. This workflow never overwrites tags.
concurrency:
  group: soamco-private-production-images
  cancel-in-progress: false

jobs:
  verify-ci:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.conclusion == 'success' &&
      !github.event.repository.fork
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    outputs:
      sha: ${{ steps.ci.outputs.sha }}
    steps:
      - name: Require both CI workflows on the exact main commit
        id: ci
        uses: actions/github-script@v9
        with:
          script: |
            const sha = context.payload.workflow_run.head_sha;
            for (const workflow_id of ['tests.yml', 'lint.yml']) {
              const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                ...context.repo, workflow_id, head_sha: sha,
                branch: 'main', event: 'push', per_page: 100,
              });
              const latest = runs
                .filter(run => run.head_sha === sha && run.head_branch === 'main' &&
                  run.event === 'push' && run.head_repository.full_name === context.payload.repository.full_name)
                .sort((a, b) => b.run_number - a.run_number)[0];
              if (!latest || latest.status !== 'completed' || latest.conclusion !== 'success') {
                core.info(`${workflow_id} has not succeeded for ${sha}; skipping publication.`);
                return;
              }
            }
            core.setOutput('sha', sha);

  images:
    needs: verify-ci
    if: >-
      always() && !cancelled() && !github.event.repository.fork &&
      ((github.event_name == 'workflow_run' && needs.verify-ci.result == 'success' && needs.verify-ci.outputs.sha != '') ||
      (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/release/3.5.4-beta' || github.ref == 'refs/heads/main')))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      # These values are browser-public repository variables, never secrets.
      VITE_APP_NAME: ${{ vars.VITE_APP_NAME }}
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_VAPID_PUBLIC_KEY: ${{ vars.VITE_FIREBASE_VAPID_PUBLIC_KEY }}
      VITE_REVERB_APP_KEY: ${{ vars.VITE_REVERB_APP_KEY }}
      VITE_REVERB_HOST: ${{ vars.VITE_REVERB_HOST }}
      VITE_REVERB_PORT: ${{ vars.VITE_REVERB_PORT }}
      VITE_REVERB_SCHEME: ${{ vars.VITE_REVERB_SCHEME }}
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
    steps:
      - name: Checkout selected commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.verify-ci.outputs.sha || github.sha }}
          persist-credentials: false

      - name: Verify private packages and unused commit tags
        id: prepare
        uses: actions/github-script@v9
        with:
          script: |
            const { prepare } = await import(`${process.env.GITHUB_WORKSPACE}/bin/production-images-ci.mjs`);
            await prepare({ github, context, core });

      - name: Set up Buildx on GitHub runner
        uses: docker/setup-buildx-action@v4

      - name: Authenticate to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build PHP frontend and web images for the VPS
        id: build
        uses: docker/bake-action@v7
        with:
          source: .
          files: ${{ steps.prepare.outputs.bake-file }}
          push: true
          provenance: mode=min
          sbom: false

      - name: Verify private publication and report immutable digests
        uses: actions/github-script@v9
        env:
          BUILD_METADATA: ${{ steps.build.outputs.metadata }}
        with:
          script: |
            const { verifyPublished } = await import(`${process.env.GITHUB_WORKSPACE}/bin/production-images-ci.mjs`);
            await verifyPublished({ github, context, core }, JSON.parse(process.env.BUILD_METADATA));
