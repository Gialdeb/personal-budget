name: Prepare production images over SSH

# Manual image preparation only; never invokes the deployment.
# Like the GHCR workflow, this must also exist on the default branch for dispatch.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: soamco-ssh-production-images
  cancel-in-progress: false

jobs:
  images:
    if: (github.ref == 'refs/heads/release/3.5.4-beta' || github.ref == 'refs/heads/main') && !github.event.repository.fork
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      VITE_APP_NAME: ${{ vars.VITE_APP_NAME }}
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_VAPID_PUBLIC_KEY: ${{ vars.VITE_FIREBASE_VAPID_PUBLIC_KEY }}
      VITE_REVERB_APP_KEY: ${{ vars.VITE_REVERB_APP_KEY }}
      VITE_REVERB_HOST: ${{ vars.VITE_REVERB_HOST }}
      VITE_REVERB_PORT: ${{ vars.VITE_REVERB_PORT }}
      VITE_REVERB_SCHEME: ${{ vars.VITE_REVERB_SCHEME }}
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
    steps:
      - name: Checkout selected commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Prepare the shared build without a registry
        id: prepare
        uses: actions/github-script@v9
        with:
          script: |
            const { prepareSsh } = await import(`${process.env.GITHUB_WORKSPACE}/bin/production-images-ci.mjs`);
            prepareSsh({ context, core });

      - name: Set up Buildx on GitHub runner
        uses: docker/setup-buildx-action@v4

      - name: Build PHP frontend and web as Docker archives
        uses: docker/bake-action@v7
        with:
          source: .
          files: ${{ steps.prepare.outputs.bake-file }}
          allow: fs.write=${{ steps.prepare.outputs.export-directory }}
          push: false
          provenance: false
          sbom: false

      - name: Verify layers and prepare checksummed transfer bundle
        env:
          EXPORT_DIRECTORY: ${{ steps.prepare.outputs.export-directory }}
        run: python3 bin/production_images_transfer.py pack "$GITHUB_SHA" "$EXPORT_DIRECTORY"

      - name: Transfer and load images only using pinned SSH
        env:
          EXPORT_DIRECTORY: ${{ steps.prepare.outputs.export-directory }}
          SOAMCO_SSH_HOST: ${{ secrets.SOAMCO_SSH_HOST }}
          SOAMCO_SSH_USER: ${{ secrets.SOAMCO_SSH_USER }}
          SOAMCO_SSH_PORT: ${{ vars.SOAMCO_SSH_PORT || '22' }}
          SOAMCO_SSH_PRIVATE_KEY: ${{ secrets.SOAMCO_SSH_PRIVATE_KEY }}
          SOAMCO_SSH_KNOWN_HOSTS: ${{ secrets.SOAMCO_SSH_KNOWN_HOSTS }}
        run: |
          python3 bin/production_images_transfer.py send "$GITHUB_SHA" "$EXPORT_DIRECTORY"
          printf '### Immagini trasferite e verificate — nessun deployment\n\nCommit: `%s`\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove runner image archives
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/soamco-ssh-images"
