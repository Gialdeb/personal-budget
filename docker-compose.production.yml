x-production-runtime: &production-runtime
  image: ${SOAMCO_PHP_IMAGE:-soamco-budget-php:production}
  env_file:
    - ${SOAMCO_ENV_FILE:-.env}
  environment: &production-environment
    APP_ENV: production
    APP_DEBUG: 'false'
    APP_MAINTENANCE_DRIVER: cache
    APP_MAINTENANCE_STORE: redis
    LOG_CHANNEL: stack
    LOG_STACK: daily,stderr
    LOG_LEVEL: ${LOG_LEVEL:-info}
    LOG_DAILY_DAYS: ${LOG_DAILY_DAYS:-14}
  volumes: &runtime-storage
    - soamco_budget_public_storage:/var/www/html/storage/app/public
    # Firebase service account files live here; keep this existing volume identity.
    - soamco_budget_private_storage:/var/www/html/storage/app/private
    - soamco_budget_logs:/var/www/html/storage/logs
  stop_grace_period: 90s

services:
  logs-init:
    image: ${SOAMCO_PHP_IMAGE:-soamco-budget-php:production}
    user: root
    entrypoint: ['sh', '-c']
    command: ['mkdir -p /var/www/html/storage/logs /var/www/html/storage/app/public /var/www/html/storage/app/private && chown -R www-data:www-data /var/www/html/storage/logs /var/www/html/storage/app && chmod 2775 /var/www/html/storage/logs /var/www/html/storage/app/public /var/www/html/storage/app/private']
    volumes: *runtime-storage

  maintenance:
    <<: *production-runtime
    stop_grace_period: 5s
    networks:
      - soamco-budget
    command: ['php', '-S', '0.0.0.0:8000', 'docker/php/maintenance-router.php']
    healthcheck:
      test: ['CMD', 'php', '-r', "exit(@file_get_contents('http://127.0.0.1:8000/__maintenance_health') === 'ready' ? 0 : 1);"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 5s

  app:
    <<: *production-runtime
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: production
      args:
        VITE_APP_NAME: ${VITE_APP_NAME:-Soamco Budget}
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:-}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
        VITE_FIREBASE_VAPID_PUBLIC_KEY: ${VITE_FIREBASE_VAPID_PUBLIC_KEY:-}
        VITE_REVERB_APP_KEY: ${VITE_REVERB_APP_KEY:-}
        VITE_REVERB_HOST: ${VITE_REVERB_HOST:-}
        VITE_REVERB_PORT: ${VITE_REVERB_PORT:-443}
        VITE_REVERB_SCHEME: ${VITE_REVERB_SCHEME:-https}
    depends_on:
      logs-init:
        condition: service_completed_successfully
    command: ['php-fpm']
    healthcheck:
      test: ['CMD', 'application-healthcheck']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  web:
    image: ${SOAMCO_WEB_IMAGE:-soamco-budget-web:production}
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
      additional_contexts:
        app_assets: service:app
    volumes:
      - soamco_budget_public_storage:/var/www/html/storage/app/public:ro
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1/up']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  horizon:
    <<: *production-runtime
    stop_grace_period: 180s
    command: ['php', 'artisan', 'horizon']
    healthcheck:
      test: ['CMD', 'php', 'artisan', 'horizon:status']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  scheduler:
    <<: *production-runtime
    command: ['php', 'artisan', 'schedule:work']
    healthcheck:
      test: ['CMD-SHELL', 'grep -aq schedule:work /proc/1/cmdline']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  reverb:
    <<: *production-runtime
    command: ['php', 'artisan', 'reverb:start']

  proxy:
    depends_on:
      web:
        condition: service_started
        restart: false
    ports:
      - '${SOAMCO_HTTP_PORT:-80}:80'
      - '${SOAMCO_HTTPS_PORT:-443}:443'
    volumes:
      - ${SOAMCO_CADDYFILE:-./docker/caddy/Caddyfile}:/etc/caddy/Caddyfile:ro

  db:
    ports: !reset []
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB for production.}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER for production.}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD for production.}

volumes:
  soamco_budget_public_storage:
  soamco_budget_private_storage:
  soamco_budget_logs:
