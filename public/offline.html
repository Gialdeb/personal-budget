<!doctype html>
<html lang="it">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Soamco · Offline</title>
        <style>
            * {
                box-sizing: border-box;
            }
            html {
                color-scheme: light dark;
            }
            body {
                margin: 0;
                min-height: 100dvh;
                display: grid;
                place-items: center;
                padding: 24px;
                background: #faf9f7;
                color: #0f172a;
                font: 16px/1.6 system-ui;
                text-align: center;
            }
            main {
                max-width: 420px;
            }
            svg.brand-logo {
                width: 64px;
                height: 64px;
                margin: 0 auto 12px;
            }
            strong {
                color: #ea5a47;
                font-size: 24px;
            }
            h1 {
                font-size: 24px;
                margin: 22px 0 10px;
            }
            p {
                color: #64748b;
                margin: 0 0 20px;
            }
            button {
                font: inherit;
                padding: 9px 20px;
                border: 1px solid #cbd5e1;
                border-radius: 12px;
                background: transparent;
                color: inherit;
                cursor: pointer;
            }
            svg {
                display: block;
                margin: 24px auto 0;
                width: 36px;
                height: 36px;
                color: #64748b;
            }
            @media (prefers-color-scheme: dark) {
                body {
                    background: #0f172a;
                    color: #f8fafc;
                }
                p {
                    color: #cbd5e1;
                }
                button {
                    border-color: #475569;
                }
            }
            .dark body {
                background: #0f172a;
                color: #f8fafc;
            }
            .dark p {
                color: #cbd5e1;
            }
            .dark button {
                border-color: #475569;
            }
        </style>
    </head>
    <body>
        <main>
            <svg
                class="brand-logo"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 64 64"
                role="img"
                aria-label="Soamco Budget"
            >
                <defs>
                    <linearGradient
                        id="bg"
                        x1="8"
                        y1="8"
                        x2="56"
                        y2="56"
                        gradientUnits="userSpaceOnUse"
                    >
                        <stop offset="0" stop-color="#F97360" />
                        <stop offset="1" stop-color="#E85A4F" />
                    </linearGradient>
                </defs>
                <rect
                    x="6"
                    y="6"
                    width="52"
                    height="52"
                    rx="15"
                    fill="url(#bg)"
                />
                <g
                    fill="none"
                    stroke="#FFFFFF"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >
                    <path d="M18 36L30 24L39 32L47 17" stroke-width="4.6" />
                    <path d="M41 17H47V23" stroke-width="4.6" />
                    <path d="M20 44V36" stroke-width="4.8" />
                    <path d="M30 44V28" stroke-width="4.8" />
                    <path d="M40 44V34" stroke-width="4.8" />
                </g>
            </svg>
            <strong>Soamco</strong
            ><svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.7"
                aria-hidden="true"
            >
                <path
                    d="m3 3 18 18M2 8a17 17 0 0 1 3-2m4-2a17 17 0 0 1 13 4M5 12a11 11 0 0 1 3-2m5-1a11 11 0 0 1 6 3m-11 4a5 5 0 0 1 8 0M12 20h.01"
                />
            </svg>
            <h1 id="title">Sei offline</h1>
            <p id="message">
                Non possiamo verificare la sessione finché la connessione non
                torna.
            </p>
            <button id="retry" onclick="window.parent.location.reload()">
                Riprova
            </button>
        </main>
        <script>
            (() => {
                const italian = navigator.language.startsWith('it');
                const kind =
                    document.documentElement.dataset.networkState || 'offline';
                document.documentElement.lang = italian ? 'it' : 'en';
                const server = kind === 'server';
                document.querySelector('#title').textContent = server
                    ? italian
                        ? 'Servizio temporaneamente non disponibile'
                        : 'Service temporarily unavailable'
                    : italian
                      ? 'Connessione non disponibile'
                      : 'You are offline';
                document.querySelector('#message').textContent = server
                    ? italian
                        ? 'Soamco non risponde correttamente. Riproveremo automaticamente tra poco.'
                        : 'Soamco is not responding correctly. We will retry shortly.'
                    : italian
                      ? 'Controlla la connessione. Riapriremo la pagina appena sarà raggiungibile. Nessun dato viene salvato offline.'
                      : 'Check your connection. The page will reopen when reachable. Nothing is saved offline.';
                document.querySelector('#retry').textContent = italian
                    ? 'Riprova'
                    : 'Retry';
                let checking = false;
                async function retry() {
                    if (checking || navigator.onLine === false) return;
                    checking = true;
                    const controller = new AbortController();
                    const timer = setTimeout(() => controller.abort(), 5000);
                    try {
                        const response = await fetch(
                            window.parent.location.href,
                            {
                                cache: 'no-store',
                                credentials: 'same-origin',
                                signal: controller.signal,
                                headers: { Accept: 'text/html' },
                            },
                        );
                        if (response.ok) window.parent.location.reload();
                    } catch {
                        /* Keep the neutral screen visible until the next attempt. */
                    } finally {
                        clearTimeout(timer);
                        checking = false;
                    }
                }
                document.querySelector('#retry').onclick = () => {
                    void retry();
                };
                window.addEventListener('online', () => {
                    void retry();
                });
                setInterval(() => {
                    if (!document.hidden) void retry();
                }, 10000);
            })();
        </script>
    </body>
</html>
